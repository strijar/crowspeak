; CrowPanel Advance firmware.
[platformio]
default_envs = crowpanel

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
framework = arduino

build_flags =
    -std=gnu++17
    -fexceptions
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Keep message I/O off the UI/network owner on every board and scheduler.
    -DSTORAGE_DEFERRED_IO=1
    "-I${PROJECT_DIR}"
    "-I${PROJECT_DIR}/src/core"

build_unflags =
    -fno-exceptions
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@7.4.3

extra_scripts =
    pre:tools/check_build_identity.py
    pre:tools/crowpanel_sdk.py
    post:tools/crowpanel_merge.py

monitor_speed = 115200
upload_speed = 460800
upload_flags = --no-stub

[lvgl16_base]
extends = common

board_build.flash_size = 16MB
board_build.partitions = partitions/standalone-16mb.csv
board_upload.flash_size = 16MB

build_flags =
    ${common.build_flags}
    -O2
    ; Silence vfs_api log_e noise — it fires on every open/remove of a missing
    ; file (normal for our atomic-save + tiered-read patterns). log_e routes to
    ; ets_printf, so esp_log_level_set doesn't help; only compile-time works.
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    "-I${PROJECT_DIR}/src/ui/lvgl"
    ; Task watchdog is already enabled by ESP-IDF defaults (5s timeout)

lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11

lib_archive = false

[protocol]
build_flags =
    -DRS_HANDHELD_FFI_LINKED=1
    "-I${PROJECT_DIR}/protocol/include"
    -lratspeak_protocol

[protocol_small]
build_flags =
    ${protocol.build_flags}
    "-L${PROJECT_DIR}/protocol/prebuilt/xtensa-esp32s3/small"

[env:crowpanel]
extends = lvgl16_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.0.2/esp32-3.0.2.zip
    framework-arduinoespressif32-libs @ file://vendor/crowpanel-sdk/sdk.tar.gz
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
; Match Arduino's qio120 preset: ROM image header stays at 80 MHz;
; the selected Elecrow bootloader/SDK initializes memory at 120 MHz.
board_build.f_flash = 80000000L
board_build.f_image = 80000000L
board_build.f_boot = 120000000L
board_build.flash_mode = qio
build_src_filter = +<core/> +<ui/lvgl/> +<boards/crowpanel/>
build_unflags =
    ${common.build_unflags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_flags =
    ${lvgl16_base.build_flags}
    ${protocol_small.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DRSCROWPANEL=1
    -DDISPLAY_WIDTH=800
    -DDISPLAY_HEIGHT=480
    -DDEVICE_SERVICE_TASK=1
    "-I${PROJECT_DIR}/src/boards/crowpanel"
extra_scripts =
    pre:tools/check_build_identity.py
    pre:tools/crowpanel_sdk.py
    post:tools/crowpanel_merge.py
upload_speed = 115200
